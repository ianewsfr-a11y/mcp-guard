# Publishes to PyPI when a GitHub Release is published, with Trusted
# Publishing (OIDC): no API token is stored anywhere.
#
# One-time setup on https://pypi.org/manage/account/publishing/ ("Add a new
# pending publisher"):
#   PyPI project name: mcp-guard-audit
#   Owner:             ianewsfr-a11y
#   Repository name:   mcp-guard
#   Workflow name:     publish.yml
#   Environment name:  pypi
# and create the `pypi` environment in the repository settings
# (Settings > Environments), ideally with a required reviewer.
#
# Actions are pinned to commit SHAs (tags in comments); Dependabot keeps them
# up to date (.github/dependabot.yml).
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, to check the release commit is on main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re, pathlib; m = re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('mcp_guard/__init__.py').read_text()); print(m.group(1) if m else '')")
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match package version v$version"
            exit 1
          fi
      - name: Check that the release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::releases must be cut from a commit on main"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-guard-audit
    permissions:
      id-token: write  # OIDC token for Trusted Publishing, nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
