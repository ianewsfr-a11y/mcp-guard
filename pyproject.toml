[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-guard"
dynamic = ["version"]
description = "Minimalist security audit CLI for MCP servers and AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "security", "ai-agents", "llm", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
mcp-guard = "mcp_guard.cli:cli"

[project.urls]
Homepage = "https://github.com/ianewsfr-a11y/mcp-guard"
Issues = "https://github.com/ianewsfr-a11y/mcp-guard/issues"

[tool.hatch.version]
path = "mcp_guard/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["mcp_guard", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE",
           "config_example.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: CLI and end-to-end tests",
]

[tool.ruff]
line-length = 100
